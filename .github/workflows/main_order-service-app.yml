# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - order-service-app

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    env: 
      VUE_APP_ORDER_SERVICE_URL: https://<order-service-app>.azurewebsites.net/
      VUE_APP_PRODUCT_SERVICE_URL: https://<product-service-app>.azurewebsites.net/
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env: 
      VUE_APP_ORDER_SERVICE_URL: https://<order-service-app>.azurewebsites.net/
      VUE_APP_PRODUCT_SERVICE_URL: https://<product-service-app>.azurewebsites.net/
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9494A3DC56F14872B03F67249CFB8EFC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3E926FAD869B4DCBAF9877294811673C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AE40D1FBB0FC40B18F3DB6270D562EBA }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'order-service-app'
          slot-name: 'Production'
          package: .
          
